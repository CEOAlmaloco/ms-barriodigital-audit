server:
  port: 8087
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

spring:
  application:
    name: ms-barriodigital-audit
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Solo kafka-admin crea topics. Audit no declara NewTopic.
    admin:
      auto-create: false
    consumer:
      group-id: audit-group
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    # Solo publica en la DLT.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 0
    listener:
      ack-mode: record
      concurrency: 3

  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: barriodigital-audit-oracle
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      data-source-properties:
        oracle.net.tns_admin: ${ORACLE_WALLET_DIR}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
    # Kafka caído no tumba el health del esqueleto.
    kafka:
      enabled: false
